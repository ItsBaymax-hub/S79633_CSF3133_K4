<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Bookstore</title>
<!-- Two Google Fonts in one link tag: Roboto (text) and Merriweather (headings) -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;family=Merriweather:wght@400;700&amp;display=swap" rel="stylesheet">
<!-- Error 1 : rel="stylesheets" is wrong. Changed to rel="stylesheet". -->
<link rel="stylesheet" href="shop.css">
<!-- Error 2 : this style block was inside the body, which is not allowed. Moved it into the head. -->
<style>
h1 { text-align: center; }
</style>
</head>
<body>

<!-- Header with background image and the page title -->
<header id="home">
<!-- Error 3 : style="color=#1B4F72;" used = instead of a colon. Fixed the syntax to color: ... ;. -->
<h1 style="color: white;">Campus Bookstore</h1>
</header>

<!-- Navigation bar -->
<nav>
<ul>
<li><a class="active" href="#home">Home</a></li>
<li><a href="#books">Books</a></li>
<li><a href="#contact">Contact</a></li>
</ul>
</nav>

<main id="books">
<p>Textbooks, stationery and more for every student.</p>
<!-- Error 4 : id="product" does not match #products in shop.css. -->
<table id="products">
<tr><th>Item</th><th>Category</th><th>Price (RM)</th></tr>
<tr><td>Web Design Basics</td><td>Textbook</td><td class="price">45.00</td></tr>
<tr><td>A4 Notebook</td><td>Stationery</td><td class="price">6.50</td></tr>
<tr><td>USB Drive 32GB</td><td>Gadget</td><td class="price">25.00</td></tr>
<tr><td>Highlighter Set</td><td>Stationery</td><td class="price">9.90</td></tr>
</table>
</main>

<footer id="contact">&copy; 2026 Campus Bookstore</footer>
</body>
</html>
